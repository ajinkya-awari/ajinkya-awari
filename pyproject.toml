[build-system]
requires = ["setuptools>=69,<81", "wheel>=0.43,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "ajinkya-awari-profile"
version = "0.1.0"
description = "Deterministic local SVG assets for Ajinkya Awari's GitHub profile."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ajinkya Avinash Awari" }]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "PyYAML>=6.0,<7",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
