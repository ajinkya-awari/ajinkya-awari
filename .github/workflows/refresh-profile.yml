name: Refresh profile heatmap

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-heatmap
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Generate contribution heatmap
        run: python scripts/generate_heatmap.py --output assets/contrib-heatmap.svg

      - name: Commit changed heatmap
        shell: bash
        run: |
          if git diff --quiet -- assets/contrib-heatmap.svg; then
            echo "Heatmap is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-heatmap.svg
          git commit -m "chore: refresh contribution heatmap"
          git push
