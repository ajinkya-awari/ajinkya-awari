  <title id="t">Ajinkya Awari: terminal introduction</title>
  <desc id="d">Animated terminal. Ajinkya Awari, MSc AI for Biomedicine and Healthcare at UCL. I build ML systems that tell you when they are wrong. 20 public repos, 7 verified results, 3 negative results published on purpose. Open to research fellowships and paid placements from March 2027.</desc>
