    #c1r { animation: type1 1.71s steps(61, end) 1.03s backwards; }@keyframes type1 { from { width: 0; } }
    #c2r { animation: type2 0.45s steps(16, end) 2.92s backwards; }@keyframes type2 { from { width: 0; } }
    #c3r { animation: type3 1.48s steps(53, end) 3.55s backwards; }@keyframes type3 { from { width: 0; } }
