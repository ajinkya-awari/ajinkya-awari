    #c5r { animation: type5 2.24s steps(80, end) 5.84s backwards; }@keyframes type5 { from { width: 0; } }
    #c6r { animation: type6 1.74s steps(62, end) 8.26s backwards; }@keyframes type6 { from { width: 0; } }
    .cur { animation: blink 1.1s steps(2, jump-none) infinite 10.17s; opacity: 0; } @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    .scan { animation: scan 5s linear infinite; } @keyframes scan { from { transform: translateX(-200px); } to { transform: translateX(900px); } }
    .glow { animation: glow 4s ease-in-out infinite; } @keyframes glow { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  ]]></style>
