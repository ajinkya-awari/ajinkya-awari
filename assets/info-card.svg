<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" role="img" aria-labelledby="t d">
  <title id="t">Proof at a glance</title>
  <desc id="d">20 public repositories, 7 verified results, 81 tests passing with CI green on the flagship benchmark, and 3 negative results published on purpose.</desc>
  <style type="text/css"><![CDATA[
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .tile { animation: rise .7s cubic-bezier(.2,.8,.2,1) backwards; } @keyframes rise { from { opacity: 0; transform: translateY(14px); } } .bar { transform-box: fill-box; transform-origin: left; animation: grow 1.1s ease-out backwards; } @keyframes grow { from { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  ]]></style>
  <rect width="880" height="150" rx="12" fill="#0d1117"/>
  <rect x=".5" y=".5" width="879" height="149" rx="11.5" fill="none" stroke="#30363d"/>
  <g class="tile" style="animation-delay:0.15s">
    <rect x="26.0" y="18" width="198.0" height="114" rx="10" fill="#161b22" stroke="#30363d"/>
    <text class="m" x="44.0" y="72" font-size="46" font-weight="700" fill="#3fb950">20</text>
    <text class="m" x="44.0" y="97" font-size="14" fill="#e6edf3">public repos</text>
    <text class="m" x="44.0" y="115" font-size="11" fill="#8b949e">of 21 planned projects</text>
    <rect class="bar" style="animation-delay:0.45s" x="44.0" y="124" width="162.0" height="2" rx="1" fill="#3fb950" opacity=".7"/>
  </g>
  <g class="tile" style="animation-delay:0.33s">
    <rect x="236.0" y="18" width="198.0" height="114" rx="10" fill="#161b22" stroke="#30363d"/>
    <text class="m" x="254.0" y="72" font-size="46" font-weight="700" fill="#58a6ff">7</text>
    <text class="m" x="254.0" y="97" font-size="14" fill="#e6edf3">verified results</text>
    <text class="m" x="254.0" y="115" font-size="11" fill="#8b949e">plus 1 partial real run</text>
    <rect class="bar" style="animation-delay:0.63s" x="254.0" y="124" width="162.0" height="2" rx="1" fill="#58a6ff" opacity=".7"/>
  </g>
  <g class="tile" style="animation-delay:0.51s">
    <rect x="446.0" y="18" width="198.0" height="114" rx="10" fill="#161b22" stroke="#30363d"/>
    <text class="m" x="464.0" y="72" font-size="46" font-weight="700" fill="#3fb950">81</text>
    <text class="m" x="464.0" y="97" font-size="14" fill="#e6edf3">tests · CI green</text>
    <text class="m" x="464.0" y="115" font-size="11" fill="#8b949e">on the flagship benchmark</text>
    <rect class="bar" style="animation-delay:0.81s" x="464.0" y="124" width="162.0" height="2" rx="1" fill="#3fb950" opacity=".7"/>
  </g>
  <g class="tile" style="animation-delay:0.69s">
    <rect x="656.0" y="18" width="198.0" height="114" rx="10" fill="#161b22" stroke="#30363d"/>
    <text class="m" x="674.0" y="72" font-size="46" font-weight="700" fill="#d29922">3</text>
    <text class="m" x="674.0" y="97" font-size="14" fill="#e6edf3">negative results</text>
    <text class="m" x="674.0" y="115" font-size="11" fill="#8b949e">published on purpose</text>
    <rect class="bar" style="animation-delay:0.99s" x="674.0" y="124" width="162.0" height="2" rx="1" fill="#d29922" opacity=".7"/>
  </g>
</svg>
